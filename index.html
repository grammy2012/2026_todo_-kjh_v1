<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strategic KPI Dashboard V6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { background-color: #f1f5f9; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        .progress-bar { transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 토글 스위치 */
        .toggle-checkbox:checked { right: 0; border-color: #1e293b; }
        .toggle-checkbox:checked + .toggle-label { background-color: #1e293b; }
        .toggle-checkbox:checked + .toggle-label:before { transform: translateX(100%); }
        
        /* 텍스트 내 숫자 자동 강조 */
        .num-highlight { font-weight: 900; color: #2563eb; background-color: #eff6ff; padding: 2px 6px; border-radius: 6px; margin: 0 2px; }
        
        /* 카드 UI 터치 액션 */
        .task-card { transition: all 0.2s ease; border: 2px solid transparent; }
        .task-card:active { transform: scale(0.98); }
        
        /* 캘린더 인풋 오버레이 (클릭 영역) */
        .date-input-overlay { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .date-input-overlay::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
    </style>
</head>
<body class="text-slate-800 pb-28">

    <!-- 🌟 상단 고정 헤더 -->

        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="w-full flex justify-between items-center md:w-auto">
                <h1 class="text-[22px] font-black text-slate-900 tracking-tight flex items-center">
                    <i class="fa-solid fa-rocket text-blue-600 mr-2.5"></i>Master PMO
                </h1>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto overflow-x-auto hide-scrollbar justify-between md:justify-end">
                <div class="flex items-center bg-slate-100 rounded-xl px-3.5 py-2 shrink-0 cursor-pointer hover:bg-slate-200 transition-colors" onclick="document.getElementById('hide-toggle').click()">

                        <input type="checkbox" id="hide-toggle" onchange="toggleHide()" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none z-10 transition-transform duration-200"/>

                    </div>
                </div>
                
                <div class="flex gap-2 shrink-0">
                    <button onclick="syncToCloud()" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-[14px] font-bold shadow-md active:scale-95 transition-all flex items-center">
                        <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 클라우드 저장
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 md:px-6">
        
        <!-- 🌟 V6 신규: 전략 대시보드 (Executive Summary) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
            
            <!-- 1) 마감 임박 (D-7 이내) 투두 리스트 보드 -->
            <div class="lg:col-span-2 bg-white p-6 md:p-8 rounded-[32px] shadow-sm border border-red-200 relative overflow-hidden flex flex-col h-full">

                <div class="flex justify-between items-center mb-5 relative z-10 border-b border-red-50 pb-3">
                    <h2 class="text-[18px] md:text-[20px] font-black text-slate-900 tracking-tight flex items-center">
                        <i class="fa-solid fa-fire text-red-500 mr-2.5 text-xl animate-pulse"></i>마감 임박 퀘스트 (D-7)
                    </h2>
                    <span class="bg-red-100 text-red-700 font-bold px-3 py-1 rounded-lg text-[13px] border border-red-200 shadow-sm" id="urgent-count">0건</span>
                </div>
                <!-- 핫라인 퀘스트 리스트가 렌더링될 곳 -->

                </div>
            </div>

                <h2 class="text-[18px] md:text-[20px] font-black text-white tracking-tight flex items-center mb-6 relative z-10">

                    </div>

                    <!-- 자바스크립트로 분야별 진행률 동적으로 렌더링됨 -->
                </div>
            </div>
        </div>

                        { text: 'AI 도서 출판용 챕터 1 샘플 강의안 작성', current: 0, target: 1, dueDate: getFutureDate(25) },
                        { text: '키프리스 AI 기술 특허 선행기술조사 캡처', current: 0, target: 3, dueDate: getFutureDate(30) }
                    ]}
                ]
            },
            {
                title: '🎨 C4. 아트 & 퍼스널 브랜딩', color: 'purple', icon: 'fa-cube',
                tasks: [
                    { title: 'P3: 음악 파이프라인 정리', kpis: [
                        { text: '개인 앨범 "피네" 트랙 EQ/믹싱 밸런스 최종 수정', current: 0, target: 1, dueDate: getFutureDate(5) },
                        { text: '"피네" 최종 마스터링 및 24bit WAV 파일 추출', current: 0, target: 1, dueDate: getFutureDate(7) },
                        { text: '비비아나킴 "메르헨" 앨범 피드백 카톡 발송', current: 0, target: 1, dueDate: getFutureDate(4) },

                        { text: '생일 선물(에어팟) 구매 및 축하 손편지 쓰기', current: 0, target: 2, dueDate: '2024-10-29' },

                    ]},

                        { text: '버스 등 자투리 시간 활용 틈틈이 스트레칭 하기', current: 0, target: 14, dueDate: getFutureDate(14) }
                    ]}
                ]
            }
        ];

        let appData = JSON.parse(localStorage.getItem('myPmoDataV6')) || initialData;
        let isHideCompleted = false;

        // 고유 ID 세팅
        appData.forEach(c => c.tasks.forEach(t => t.kpis.forEach(k => { 
            if(!k.id) k.id = 'kpi_' + Math.random().toString(36).substr(2,9);
            if(k.current === undefined) k.current = 0;
            if(k.target === undefined) k.target = 1;
        })));

        function showToast(msg, icon = 'fa-check-circle') {
            const t = document.getElementById('toast');
            t.innerHTML = `<i class="fa-solid ${icon} text-emerald-400 text-lg"></i> <span>${msg}</span>`;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        async function syncToCloud() {
            const url = localStorage.getItem('googleSheetApiUrl');
            showToast('동기화 중입니다...', 'fa-spinner fa-spin');
            try { 
                await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(appData) }); 
                showToast('클라우드 저장 완료!'); 
            } catch(e) { showToast('저장 실패: 네트워크 확인', 'fa-xmark'); }
        }

        function toggleHide() { 
            isHideCompleted = document.getElementById('hide-toggle').checked; 
            render(); 
        }

        // 수치 컨트롤 
        function updateKpi(cIdx, tIdx, kIdx, amount) {
            let kpi = appData[cIdx].tasks[tIdx].kpis.find(k => k.id === kIdx);
            if(kpi) {
                kpi.current = Math.max(0, Math.min(kpi.target, kpi.current + amount));
                localStorage.setItem('myPmoDataV6', JSON.stringify(appData));
                render();
            }
        }

        // 마감일 변경
        function changeDueDate(cIdx, tIdx, kIdx, newDate) {
            let kpi = appData[cIdx].tasks[tIdx].kpis.find(k => k.id === kIdx);
            if(kpi && newDate) {
                kpi.dueDate = newDate;
                localStorage.setItem('myPmoDataV6', JSON.stringify(appData));
                render();
                showToast('마감일이 변경되어 재정렬되었습니다!', 'fa-calendar-check');
            }
        }

        // 텍스트 내 숫자 파란색 굵게 하이라이트
        function formatText(text) {
            return text.replace(/([0-9,]+(?:건|개|명|장|회|%|곳|종|원|학점|시간|일|문장|부|곡|줄)?)/g, '<span class="num-highlight">$1</span>');
        }

        // 컨트롤 버튼 생성 헬퍼
        function getControlBtn(kpi, isDone, cIdx, tIdx, size = 'normal') {
            if(kpi.target === 1) {
                let btnCls = size === 'small' ? 'w-8 h-8 rounded-xl' : 'w-10 h-10 rounded-[14px]';
                let iconCls = size === 'small' ? 'text-[14px]' : 'text-[20px]';
                return `
                    <div class="${btnCls} flex items-center justify-center cursor-pointer transition-all shadow-sm border-[2px] ${isDone ? 'bg-slate-800 border-slate-800' : 'bg-white border-slate-300 hover:border-slate-400'}" onclick="updateKpi(${cIdx}, ${tIdx}, '${kpi.id}', ${isDone ? -1 : 1})">
                        <i class="fa-solid fa-check text-white ${iconCls} transition-transform ${isDone ? 'scale-100 opacity-100' : 'scale-50 opacity-0'}"></i>
                    </div>`;
            } else {
                let pCls = size === 'small' ? 'p-1 rounded-xl' : 'p-1.5 rounded-2xl';
                let btnCls = size === 'small' ? 'w-7 h-7 rounded-lg' : 'w-8 h-8 rounded-xl';
                let textCls = size === 'small' ? 'w-10 text-[13px]' : 'w-12 text-[14px]';
                return `
                    <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 shadow-sm no-select ${pCls}">
                        <button onclick="updateKpi(${cIdx}, ${tIdx}, '${kpi.id}', -1)" class="${btnCls} bg-white hover:bg-slate-200 text-slate-500 shadow-sm flex items-center justify-center active:scale-95 transition-all"><i class="fa-solid fa-minus text-[11px]"></i></button>
                        <span class="font-black text-slate-800 text-center tracking-tighter ${textCls}">${kpi.current}<span class="text-slate-400 font-normal mx-0.5">/</span>${kpi.target}</span>
                        <button onclick="updateKpi(${cIdx}, ${tIdx}, '${kpi.id}', ${kpi.target >= 20 ? 5 : 1})" class="${btnCls} bg-slate-800 hover:bg-slate-700 text-white shadow-sm flex items-center justify-center active:scale-95 transition-all"><i class="fa-solid fa-plus text-[11px]"></i></button>
                    </div>`;
            }
        }

        // 달력 뱃지 생성 헬퍼
        function getDdayBadge(dateString, isDone, cIdx, tIdx, kId, style = 'normal') {
            if(isDone) return '<span class="text-slate-400 text-[12px] font-bold bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 mt-2.5 inline-flex items-center"><i class="fa-solid fa-check mr-1.5"></i>완료됨</span>';
            
            const today = new Date(); today.setHours(0,0,0,0);
            const due = new Date(dateString);
            const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
            
            let cls = 'text-slate-600 bg-slate-100 border-slate-200 hover:bg-slate-200';
            let label = `D-${diffDays}`;
            let icon = '<i class="fa-regular fa-calendar text-slate-500"></i>';
            
            if (diffDays < 0) { 
                cls = 'text-red-700 bg-red-50 border-red-200'; label = `초과 D+${Math.abs(diffDays)}`; icon = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i>';
            } else if (diffDays === 0) { 
                cls = 'text-white bg-red-500 border-red-600 shadow-md animate-pulse'; label = '오늘 마감!'; icon = '<i class="fa-solid fa-fire text-white"></i>';
            } else if (diffDays <= 3) { 
                cls = 'text-orange-700 bg-orange-50 border-orange-200'; icon = '<i class="fa-regular fa-clock text-orange-500"></i>';
            }

            const mm = String(due.getMonth()+1).padStart(2,'0');
            const dd = String(due.getDate()).padStart(2,'0');
            
            let wrapCls = style === 'compact' ? 'mt-1.5 px-2 py-0.5 rounded-lg' : 'mt-3.5 px-3 py-1.5 rounded-xl';
            let txtCls = style === 'compact' ? 'text-[11px]' : 'text-[13px]';

            return `
                <div class="relative inline-flex items-center gap-2 cursor-pointer group border transition-colors shadow-sm ${cls} ${wrapCls}">
                    <span class="${txtCls} font-black flex items-center gap-1.5 pointer-events-none">${icon}${label}</span>
                    <div class="h-3 w-[1.5px] bg-current opacity-20 pointer-events-none mx-0.5"></div>
                    <input type="date" value="${dateString}" onchange="changeDueDate(${cIdx}, ${tIdx}, '${kId}', this.value)" class="date-input-overlay">
                    <span class="text-[12px] font-bold opacity-80 pointer-events-none flex items-center">${mm}/${dd}</span>
                </div>`;
        }

        // 🌟 전체 렌더링 로직
        function render() {
            const grid = document.getElementById('dashboard-container');
            const progressPanel = document.getElementById('category-progress-container');
            const urgentPanel = document.getElementById('urgent-tasks-container');
            
            grid.innerHTML = ''; progressPanel.innerHTML = ''; urgentPanel.innerHTML = '';
            
            let totalCurrent = 0, totalTarget = 0;
            let urgentTasks = [];
            const today = new Date(); today.setHours(0,0,0,0);

            appData.forEach((cat, cIdx) => {
                let catCurrent = 0, catTarget = 0;
                let tasksHtml = '';
                let hasVisibleTask = false;

                cat.tasks.forEach((task, tIdx) => {
                    let kpisHtml = ''; let visibleCount = 0;

                    // 마감일 기준 정렬
                    let sortedKpis = [...task.kpis].sort((a, b) => {
                        const aDone = a.current >= a.target; const bDone = b.current >= b.target;
                        if(aDone !== bDone) return aDone ? 1 : -1; 
                        return new Date(a.dueDate) - new Date(b.dueDate);
                    });

                    sortedKpis.forEach((kpi) => {
                        catTarget += kpi.target; totalTarget += kpi.target;
                        catCurrent += kpi.current; totalCurrent += kpi.current;
                        
                        let isDone = kpi.current >= kpi.target;
                        
                        // 🚨 1. D-7 이내 임박 퀘스트만 추출 (미완료건만)
                        if(!isDone) {
                            const diffDays = Math.ceil((new Date(kpi.dueDate) - today) / (1000 * 60 * 60 * 24));
                            if(diffDays <= 7) {
                                urgentTasks.push({ kpi, cIdx, tIdx, diffDays, cat });
                            }
                        }

                        if(isHideCompleted && isDone) return;
                        visibleCount++;

                        // 메인 리스트 카드 렌더링
                        kpisHtml += `
                            <div class="task-card flex flex-col sm:flex-row items-start gap-4 p-5 mb-4 rounded-3xl bg-white border border-slate-200/80 shadow-sm ${isDone ? 'opacity-50 grayscale bg-slate-50' : ''}">
                                <div class="shrink-0 mt-0.5">${getControlBtn(kpi, isDone, cIdx, tIdx, 'normal')}</div>
                                <div class="flex-1 min-w-0 w-full">
                                    <div class="text-[16px] md:text-[17px] leading-snug break-keep ${isDone ? 'text-slate-400 line-through' : 'text-slate-900 font-bold'}">${isDone ? kpi.text : formatText(kpi.text)}</div>
                                    ${getDdayBadge(kpi.dueDate, isDone, cIdx, tIdx, kpi.id, 'normal')}
                                </div>
                            </div>
                        `;
                    });

                    if(visibleCount > 0) {
                        hasVisibleTask = true;
                        tasksHtml += `
                            <div class="mb-10 last:mb-0 bg-slate-50/70 p-3 md:p-5 rounded-[32px] border border-slate-100">
                                <h3 class="text-[15px] font-black text-slate-800 mb-4 tracking-tight flex items-center px-1"><span class="w-2.5 h-2.5 rounded-full bg-${cat.color}-500 mr-2.5"></span>${task.title}</h3>
                                <div>${kpisHtml}</div>
                            </div>
                        `;
                    }
                });

                let catPercent = catTarget === 0 ? 0 : Math.floor((catCurrent / catTarget) * 100);

                // 📊 2. 프로젝트 진척률(Progress) 브리핑 패널 렌더링
                let shortTitle = cat.title.split(' ').slice(1).join(' ');
                progressPanel.innerHTML += `
                    <div class="bg-slate-800/40 p-3.5 rounded-2xl border border-slate-700/50">
                        <div class="flex justify-between items-end mb-2.5 px-1">
                            <span class="text-[13px] font-bold text-slate-300 flex items-center"><i class="fa-solid ${cat.icon} text-${cat.color}-400 mr-2 w-4 text-center"></i>${shortTitle}</span>
                            <span class="text-[14px] font-black text-white">${catPercent}%</span>
                        </div>
                        <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                            <div class="bg-${cat.color}-500 h-2 rounded-full progress-bar" style="width: ${catPercent}%"></div>
                        </div>
                    </div>
                `;

                if(isHideCompleted && !hasVisibleTask) {
                    tasksHtml = `<div class="flex flex-col items-center justify-center py-24 text-slate-300"><i class="fa-solid fa-clipboard-check text-6xl text-${cat.color}-400/50 mb-5"></i><p class="font-bold text-[16px] text-slate-400">모든 퀘스트 클리어!</p></div>`;
                }

                grid.innerHTML += `
                    <div class="bg-white rounded-[36px] border border-slate-200 overflow-hidden flex flex-col h-full shadow-sm">
                        <div class="px-7 md:px-8 py-6 flex justify-between items-center relative border-b border-slate-100">
                            <h2 class="text-[20px] font-black text-slate-900 tracking-tight flex items-center truncate"><i class="fa-solid ${cat.icon} text-${cat.color}-500 w-8 mr-1.5 text-xl"></i>${cat.title.split(' ')[0]} ${shortTitle}</h2>
                        </div>
                        <div class="w-full bg-slate-100 h-2"><div class="bg-${cat.color}-500 h-2 progress-bar shadow-sm" style="width: ${catPercent}%"></div></div>
                        <div class="px-4 md:px-6 pt-6 pb-8 flex-1">${tasksHtml}</div>
                    </div>
                `;
            });

            // 🚨 3. 마감 임박 (D-7 이내) 리스트 렌더링
            urgentTasks.sort((a, b) => a.diffDays - b.diffDays); // 가장 급한 날짜순으로 정렬
            document.getElementById('urgent-count').innerText = `${urgentTasks.length}건 대기중`;
            
            if(urgentTasks.length === 0) {
                urgentPanel.innerHTML = `<div class="flex flex-col items-center justify-center h-full min-h-[180px] text-slate-400"><i class="fa-solid fa-mug-hot text-4xl mb-4 text-red-200"></i><p class="font-bold text-sm">일주일 내로 마감할 퀘스트가 없습니다!<br>여유를 즐기세요.</p></div>`;
            } else {
                urgentTasks.forEach(item => {
                    urgentPanel.innerHTML += `
                        <div class="flex items-center gap-3.5 bg-red-50/40 p-4 rounded-2xl border border-red-100 hover:bg-red-50 hover:border-red-200 transition-colors">
                            <div class="shrink-0">${getControlBtn(item.kpi, false, item.cIdx, item.tIdx, 'small')}</div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[15px] font-bold text-slate-900 leading-snug break-keep">${formatText(item.kpi.text)}</div>
                                <div class="flex flex-wrap items-center gap-2 mt-2">
                                    ${getDdayBadge(item.kpi.dueDate, false, item.cIdx, item.tIdx, item.kpi.id, 'compact')}
                                    <span class="text-[11px] font-bold text-slate-500 mt-1.5 flex items-center bg-white px-2 py-1 rounded-md border border-slate-200"><span class="w-1.5 h-1.5 rounded-full bg-${item.cat.color}-400 mr-1.5"></span>${item.cat.title.split(' ')[1]}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            // 총괄 요약 업데이트
            let overall = totalTarget === 0 ? 0 : Math.floor((totalCurrent / totalTarget) * 100);
            document.getElementById('total-progress-text').innerText = `${overall}%`;
            document.getElementById('total-count-text').innerText = `${totalCurrent} / ${totalTarget}`;
            document.getElementById('total-progress').style.width = `${overall}%`;
        }

        render();
    </script>
</body>
</html>
