<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Micro KPI Dashboard V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { background-color: #f3f4f6; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        .progress-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 토글 스위치 */
        .toggle-checkbox:checked { right: 0; border-color: #1e293b; }
        .toggle-checkbox:checked + .toggle-label { background-color: #1e293b; }
        .toggle-checkbox:checked + .toggle-label:before { transform: translateX(100%); }
        
        /* 텍스트 내 숫자 자동 강조 */
        .num-highlight { font-weight: 900; color: #2563eb; background-color: #eff6ff; padding: 2px 6px; border-radius: 6px; margin: 0 2px; }
        
        /* 카드 UI 부드러운 호버 및 터치 액션 */
        .task-card { transition: all 0.2s ease; border: 2px solid transparent; }
        .task-card:active { transform: scale(0.98); }
        
        /* 🌟 달력(Date) 인풋을 뱃지 위에 투명하게 덮어씌움 */
        .date-input-overlay { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .date-input-overlay::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
    </style>
</head>

                        { text: '키프리스(KIPRIS) AI 기술 특허 선행기술조사 캡처', current: 0, target: 3, dueDate: getFutureDate(30) }
                    ]}
                ]
            },
            {
                title: '🎨 C4. 아트 & 퍼스널 브랜딩', color: 'purple', icon: 'fa-cube',
                tasks: [
                    { title: 'P3: 음악 파이프라인 정리', kpis: [
                        { text: '개인 앨범 "피네" 트랙 EQ/믹싱 밸런스 최종 수정', current: 0, target: 1, dueDate: getFutureDate(5) },

        ];

        let appData = JSON.parse(localStorage.getItem('myPmoDataV5')) || initialData;
        let isHideCompleted = false;

        // 고유 ID 
        appData.forEach(c => c.tasks.forEach(t => t.kpis.forEach(k => { 
            if(!k.id) k.id = 'kpi_' + Math.random().toString(36).substr(2,9);
            if(k.current === undefined) k.current = 0;
            if(k.target === undefined) k.target = 1;
        })));

        function showToast(msg, icon = 'fa-check-circle') {
            const t = document.getElementById('toast');
            t.innerHTML = `<i class="fa-solid ${icon} text-emerald-400 text-lg"></i> <span>${msg}</span>`;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        async function syncToCloud() {
            const url = localStorage.getItem('googleSheetApiUrl');
            showToast('동기화 중입니다...', 'fa-spinner fa-spin');
            try { 
                await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(appData) }); 
                showToast('클라우드에 안전하게 업데이트되었습니다!'); 
            } catch(e) { showToast('저장 실패', 'fa-xmark'); }
        }

        function toggleHide() { 
            isHideCompleted = document.getElementById('hide-toggle').checked; 
            render(); 
        }

        // 수치 컨트롤
        function updateKpi(cIdx, tIdx, kIdx, amount) {
            let kpi = appData[cIdx].tasks[tIdx].kpis.find(k => k.id === kIdx);
            if(kpi) {
                kpi.current = Math.max(0, Math.min(kpi.target, kpi.current + amount));
                localStorage.setItem('myPmoDataV5', JSON.stringify(appData));
                render();
            }
        }

        // 🌟 달력 인풋 체인지 함수
        function changeDueDate(cIdx, tIdx, kIdx, newDate) {
            let kpi = appData[cIdx].tasks[tIdx].kpis.find(k => k.id === kIdx);
            if(kpi && newDate) {
                kpi.dueDate = newDate;
                localStorage.setItem('myPmoDataV5', JSON.stringify(appData));
                render();
                showToast('마감일이 변경되어 재정렬되었습니다!', 'fa-calendar-check');
            }
        }

        // 텍스트 내 숫자 강조
        function formatText(text) {
            return text.replace(/([0-9,]+(?:건|개|명|장|회|%|곳|종|원|학점|시간|일|문장|부|곡|줄)?)/g, '<span class="num-highlight">$1</span>');
        }

        // 🌟 클릭하면 달력이 뜨는 마법의 뱃지 UI
        function getDdayBadge(dateString, isDone, cIdx, tIdx, kId) {
            if(isDone) return '<span class="text-slate-400 text-[12px] font-bold bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 mt-2.5 inline-flex items-center"><i class="fa-solid fa-check mr-1.5"></i>완료됨</span>';
            
            const today = new Date(); today.setHours(0,0,0,0);
            const due = new Date(dateString);
            const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
            
            let cls = 'text-slate-600 bg-slate-100 border-slate-200 hover:bg-slate-200';
            let label = `D-${diffDays}`;
            let icon = '<i class="fa-regular fa-calendar text-slate-500"></i>';
            
            if (diffDays < 0) { 
                cls = 'text-red-700 bg-red-50 border-red-200'; label = `기한 초과 D+${Math.abs(diffDays)}`; icon = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i>';
            } else if (diffDays === 0) { 
                cls = 'text-white bg-red-500 border-red-600 shadow-md animate-pulse'; label = '오늘 마감!'; icon = '<i class="fa-solid fa-fire text-white"></i>';
            } else if (diffDays <= 3) { 
                cls = 'text-orange-700 bg-orange-50 border-orange-200'; icon = '<i class="fa-regular fa-clock text-orange-500"></i>';
            }
            
            const mm = String(due.getMonth()+1).padStart(2,'0');
            const dd = String(due.getDate()).padStart(2,'0');

            return `
                <div class="relative inline-flex items-center gap-2 mt-3.5 cursor-pointer group border ${cls} px-3 py-1.5 rounded-xl transition-colors shadow-sm">
                    <span class="text-[13px] font-black flex items-center gap-1.5 pointer-events-none">${icon}${label}</span>
                    <div class="h-3 w-[1.5px] bg-current opacity-20 pointer-events-none mx-0.5"></div>
                    <!-- 🔥 투명 캘린더 인풋 -->
                    <input type="date" value="${dateString}" onchange="changeDueDate(${cIdx}, ${tIdx}, '${kId}', this.value)" class="date-input-overlay">
                    <span class="text-[12px] font-bold opacity-80 pointer-events-none flex items-center">${mm}/${dd} <i class="fa-solid fa-pen text-[10px] ml-1.5 opacity-0 group-hover:opacity-100 transition-opacity"></i></span>
                </div>`;
        }

        function render() {
            const grid = document.getElementById('dashboard-container');
            grid.innerHTML = '';
            let totalCurrent = 0, totalTarget = 0;

            appData.forEach((cat, cIdx) => {
                let catCurrent = 0, catTarget = 0;
                let tasksHtml = '';
                let hasVisibleTask = false;

                cat.tasks.forEach((task, tIdx) => {
                    let kpisHtml = '';
                    let visibleCount = 0;

                    // 🌟 마감일이 급한 퀘스트부터 위로 자동 정렬
                    let sortedKpis = [...task.kpis].sort((a, b) => {
                        const aDone = a.current >= a.target; const bDone = b.current >= b.target;
                        if(aDone !== bDone) return aDone ? 1 : -1; 
                        return new Date(a.dueDate) - new Date(b.dueDate);
                    });

                    sortedKpis.forEach((kpi) => {
                        catTarget += kpi.target; totalTarget += kpi.target;
                        catCurrent += kpi.current; totalCurrent += kpi.current;
                        
                        let isDone = kpi.current >= kpi.target;
                        if(isHideCompleted && isDone) return;
                        visibleCount++;

                        // 컨트롤 버튼
                        let controlHtml = '';
                        if(kpi.target === 1) {
                            controlHtml = `
                                <div class="w-10 h-10 rounded-[14px] flex items-center justify-center cursor-pointer transition-all shadow-sm border-[2px] ${isDone ? 'bg-slate-800 border-slate-800' : 'bg-white border-slate-300 hover:border-slate-400'}" onclick="updateKpi(${cIdx}, ${tIdx}, '${kpi.id}', ${isDone ? -1 : 1})">
                                    <i class="fa-solid fa-check text-white text-[20px] transition-transform ${isDone ? 'scale-100 opacity-100' : 'scale-50 opacity-0'}"></i>
                                </div>`;
                        } else {
                            controlHtml = `
                                <div class="flex items-center gap-1.5 bg-slate-50 rounded-2xl p-1.5 border border-slate-200 shadow-sm no-select">
                                    <button onclick="updateKpi(${cIdx}, ${tIdx}, '${kpi.id}', -1)" class="w-8 h-8 rounded-xl bg-white hover:bg-slate-200 text-slate-500 shadow-sm flex items-center justify-center active:scale-95 transition-all"><i class="fa-solid fa-minus text-[13px]"></i></button>
                                    <span class="text-[14px] font-black text-slate-800 w-12 text-center tracking-tighter">${kpi.current}<span class="text-slate-400 font-normal mx-0.5">/</span>${kpi.target}</span>
                                    <button onclick="updateKpi(${cIdx}, ${tIdx}, '${kpi.id}', ${kpi.target >= 20 ? 5 : 1})" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-white shadow-sm flex items-center justify-center active:scale-95 transition-all"><i class="fa-solid fa-plus text-[13px]"></i></button>
                                </div>`;
                        }

                        // 🌟 가시성을 극대화한 넓은 여백의 하얀색 카드(Card) 
                        kpisHtml += `
                            <div class="task-card flex flex-col p-5 mb-4 rounded-3xl bg-white border border-slate-200/80 shadow-sm ${isDone ? 'opacity-50 grayscale bg-slate-50' : ''}">
                                <div class="flex items-start gap-4 w-full">
                                    <div class="shrink-0 mt-0.5">${controlHtml}</div>
                                    <div class="flex-1 min-w-0 pt-0.5">
                                        <div class="text-[16px] md:text-[17px] leading-snug break-keep ${isDone ? 'text-slate-400 line-through' : 'text-slate-900 font-bold'}">${isDone ? kpi.text : formatText(kpi.text)}</div>
                                        ${getDdayBadge(kpi.dueDate, isDone, cIdx, tIdx, kpi.id)}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    if(visibleCount > 0) {
                        hasVisibleTask = true;
                        tasksHtml += `
                            <div class="mb-10 last:mb-0 bg-slate-50/70 p-3 md:p-5 rounded-[32px] border border-slate-100">
                                <h3 class="text-[15px] font-black text-slate-800 mb-4 tracking-tight flex items-center px-1"><span class="w-2.5 h-2.5 rounded-full bg-${cat.color}-500 mr-2.5"></span>${task.title}</h3>
                                <div>${kpisHtml}</div>
                            </div>
                        `;
                    }
                });

                let catPercent = catTarget === 0 ? 0 : Math.floor((catCurrent / catTarget) * 100);

                if(isHideCompleted && !hasVisibleTask) {
                    tasksHtml = `<div class="flex flex-col items-center justify-center py-24 text-slate-300"><i class="fa-solid fa-clipboard-check text-6xl text-${cat.color}-400/50 mb-5"></i><p class="font-bold text-[16px] text-slate-400">모든 퀘스트 클리어!</p></div>`;
                }

                grid.innerHTML += `
                    <div class="bg-white rounded-[36px] border border-slate-200 overflow-hidden flex flex-col h-full shadow-sm">
                        <div class="px-7 md:px-8 py-6 flex justify-between items-center relative border-b border-slate-100">
                            <h2 class="text-[20px] font-black text-slate-900 tracking-tight flex items-center"><i class="fa-solid ${cat.icon} text-${cat.color}-500 w-8 mr-1.5 text-xl"></i>${cat.title}</h2>
                            <span class="text-[14px] font-black bg-slate-100 px-3.5 py-1.5 rounded-xl text-slate-700">${catPercent}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2"><div class="bg-${cat.color}-500 h-2 progress-bar shadow-sm" style="width: ${catPercent}%"></div></div>
                        <div class="px-3 md:px-6 pt-6 pb-8 flex-1">${tasksHtml}</div>
                    </div>
                `;
            });

            let overall = totalTarget === 0 ? 0 : Math.floor((totalCurrent / totalTarget) * 100);
            document.getElementById('total-progress-text').innerText = `${overall}%`;
            document.getElementById('total-count-text').innerText = `${totalCurrent} / ${totalTarget}`;
            document.getElementById('total-progress').style.width = `${overall}%`;
        }

        render();
    </script>
</body>
</html>
